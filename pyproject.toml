[project]
name = "aether-mcp"
version = "1.0.0"
description = "Scan files, hunt threats and pivot campaigns with MetaDefender Aether."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<2.4",
    "httpx>=0.27",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://www.filescan.io"
Repository = "https://github.com/filescanio/aether-mcp"

[dependency-groups]
dev = ["pytest"]

[project.scripts]
aether-mcp = "aether_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether_mcp"]
